name: Build & Release Blacksea Robotics APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Zorunlu Güncelleme mi? (true/false)'
        required: false
        default: 'false'
      changelog:
        description: 'Bu güncellemede yapılan değişiklikler'
        required: false
        default: 'Otomatik APK güncellemesi ve performans iyileştirmeleri.'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Secrets & Environment (.env)
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}" >> .env

      - name: Setup Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            if [ ! -f "my-upload-key.jks" ]; then
              keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=BlackseaRobotics, OU=Robotics, O=UnyeFenLisesi, L=Unye, ST=Ordu, C=TR"
            fi
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Android APK
        run: |
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        id: find_apk
        run: |
          set +e
          APK_PATH=""
          if [ -d "app/build/outputs/apk/release" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ] && [ -d "app/build/outputs/apk/debug" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ] && [ -d "app/build/outputs/apk" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          set -e

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "HATA: Derlenen APK bulunamadı!"
            exit 1
          fi

          DETECTED_VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2 || true)
          DETECTED_VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | awk '{print $NF}' || true)

          if [ -z "$DETECTED_VERSION_NAME" ]; then
            DETECTED_VERSION_NAME="1.0.4"
          fi
          if [ -z "$DETECTED_VERSION_CODE" ]; then
            DETECTED_VERSION_CODE="5"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${DETECTED_VERSION_NAME}"
          fi

          FINAL_APK_NAME="BlackseaRobotics-${TAG}.apk"
          cp "$APK_PATH" "${FINAL_APK_NAME}"

          SHA256=$(sha256sum "${FINAL_APK_NAME}" | awk '{print $1}')

          echo "apk_path=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "version_code=${DETECTED_VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${DETECTED_VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "APK Ready: ${FINAL_APK_NAME} (Version: ${DETECTED_VERSION_NAME}, Code: ${DETECTED_VERSION_CODE}, SHA256: ${SHA256})"

      - name: Extract Release Notes & Metadata
        id: notes
        run: |
          INPUT_LOG="${{ github.event.inputs.changelog }}"
          FORCE="${{ github.event.inputs.force_update }}"
          SHA="${{ steps.find_apk.outputs.sha256 }}"

          if [ -z "$INPUT_LOG" ]; then
            INPUT_LOG="Blacksea Robotics Mobil Uygulama Güncellemesi"
          fi
          if [ -z "$FORCE" ]; then
            FORCE="false"
          fi

          VC="${{ steps.find_apk.outputs.version_code }}"

          cat <<EOF > release_notes.md
          ### 🤖 Blacksea Robotics Güncellemesi (${{ steps.find_apk.outputs.tag_name }})
          ${INPUT_LOG}

          ---
          - **Sürüm Kodu (versionCode):** ${VC}
          - **SHA-256 Checksum:** \`${SHA}\`
          - **Zorunlu Güncelleme:** ${FORCE}
          EOF

      - name: Publish GitHub Release via CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.find_apk.outputs.tag_name }}"
          APK="${{ steps.find_apk.outputs.apk_path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Mevcut sürüm ($TAG) güncelleniyor..."
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "Blacksea Robotics $TAG" \
              --notes-file release_notes.md \
              --latest
          else
            echo "Yeni sürüm ($TAG) oluşturuluyor..."
            gh release create "$TAG" "$APK" \
              --title "Blacksea Robotics $TAG" \
              --notes-file release_notes.md \
              --latest
          fi
