name: Build & Release Blacksea Robotics APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Zorunlu Güncelleme mi? (true/false)'
        required: false
        default: 'false'
      changelog:
        description: 'Bu güncellemede yapılan değişiklikler'
        required: false
        default: 'Otomatik APK güncellemesi ve performans iyileştirmeleri.'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Required Android SDK Components & Accept Licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Verify & Configure Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret kullanılıyor..."
            if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 geçerli bir Base64 metni değil! Lütfen google-services.json dosyasını doğru Base64 formatında ekleyin veya doğrudan GOOGLE_SERVICES_JSON secret'ını kullanın."
              exit 1
            fi
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret kullanılıyor..."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ ! -s "app/google-services.json" ]; then
            echo "::error::app/google-services.json dosyası repoda bulunamadı ve GitHub Secrets (GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_BASE64) tanımlı değil!"
            echo "Çözüm 1: GitHub > Settings > Secrets and variables > Actions bölümüne GOOGLE_SERVICES_JSON secret'ı olarak google-services.json içeriğini ekleyin."
            echo "Çözüm 2: Base64 kullanmak isterseniz GOOGLE_SERVICES_JSON_BASE64 secret'ını ekleyin."
            echo "Çözüm 3: app/google-services.json dosyasını doğrudan GitHub reposunun app/ klasörüne yükleyin."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          try:
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"::error::app/google-services.json geçerli bir JSON dosyası değil: {e}", file=sys.stderr)
              sys.exit(1)

          clients = data.get("client", [])
          pkg = "com.aistudio.blacksearobotics.kxnqpv"
          matched = [c for c in clients if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg]
          if not matched:
              print(f"::error::app/google-services.json içinde '{pkg}' paket adı bulunamadı!", file=sys.stderr)
              sys.exit(1)

          oauth_clients = matched[0].get("oauth_client", [])
          invite_clients = matched[0].get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", [])
          web_clients = [o for o in (oauth_clients + invite_clients) if o.get("client_type") == 3]
          if not web_clients:
              print("::error::app/google-services.json içinde client_type=3 (default_web_client_id için Web Client ID) eksik!", file=sys.stderr)
              sys.exit(1)
          print(f"Firebase doğrulandı: package={pkg}, web_client_id={web_clients[0].get('client_id')}")
          PY

      - name: Prepare Secrets & Environment (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          python3 - <<'PY'
          import os

          def sanitize_for_properties(val: str) -> str:
              val = val.replace("\r", "").replace("\n", "").strip()
              if len(val) >= 2 and ((val[0] == '"' and val[-1] == '"') or (val[0] == "'" and val[-1] == "'")):
                  val = val[1:-1].strip()
              val = val.replace("\\", "\\\\").replace('"', '\\"')
              return val

          lines = []
          for key in ("GEMINI_API_KEY", "FIREBASE_APPCHECK_DEBUG_TOKEN"):
              raw = os.environ.get(key, "")
              cleaned = sanitize_for_properties(raw)
              if cleaned:
                  lines.append(f"{key}={cleaned}")

          with open(".env", "w", encoding="utf-8") as f:
              if lines:
                  f.write("\n".join(lines) + "\n")
          print(f".env hazırlandı ({len(lines)} geçerli değişken eklendi).")
          PY

      - name: Setup Permanent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ]; then
              echo "::error::KEYSTORE_BASE64 tanımlı fakat KEYSTORE_STORE_PASSWORD veya KEYSTORE_KEY_PASSWORD eksik!"
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=$KEYSTORE_STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD" >> $GITHUB_ENV
            echo "Kalıcı keystore GitHub Secrets (KEYSTORE_BASE64) üzerinden yüklendi."
          elif [ -s "my-upload-key.jks" ]; then
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "Kalıcı keystore repodaki my-upload-key.jks dosyasından kullanılıyor."
          else
            echo "::error::Kalıcı release keystore bulunamadı! Her derlemede farklı imza oluşmaması ve 'Uygulama yüklenemedi' hatasını önlemek için repoya my-upload-key.jks dosyasını ekleyin veya GitHub Secrets içine KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD ve KEYSTORE_KEY_PASSWORD ekleyin."
            exit 1
          fi

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

          # Verify keystore integrity and log certificate SHA-256 fingerprint
          PASS="${KEYSTORE_STORE_PASSWORD:-android}"
          keytool -list -v -keystore my-upload-key.jks -storepass "$PASS" -alias upload | grep -E "Alias name|SHA1|SHA256"

          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Compute Monotonic VersionCode & VersionName
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_text = f.read()

          m_code = re.search(r'versionCode\s*=.*?(\d+)\s*$', gradle_text, re.MULTILINE)
          m_name = re.search(r'versionName\s*=.*?"([^"]+)"\s*$', gradle_text, re.MULTILINE)
          base_code = int(m_code.group(1)) if m_code else 6
          base_name = m_name.group(1) if m_name else "1.0.5"

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          max_released_code = 0
          existing_tags = set()

          if repo:
              try:
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=30")
                  req.add_header("Accept", "application/vnd.github.v3+json")
                  req.add_header("User-Agent", "BSR-CI-Versioning")
                  if token:
                      req.add_header("Authorization", f"Bearer {token}")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      releases = json.loads(resp.read().decode("utf-8"))
                      for rel in releases:
                          tag = str(rel.get("tag_name", "")).strip()
                          if tag:
                              existing_tags.add(tag)
                          body = str(rel.get("body", ""))
                          for match in re.findall(r'versionCode[\s)*`]*[:=][\s*`]*(\d+)', body, re.IGNORECASE):
                              max_released_code = max(max_released_code, int(match))
              except Exception as e:
                  print(f"Önceki release sorgulaması atlandı ({e})")

          next_code = max(base_code, max_released_code + 1)

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("refs/tags/v"):
              final_tag = ref_name
              final_name = ref_name.lstrip("vV")
          else:
              parts = [int(p) for p in base_name.split(".") if p.isdigit()]
              while len(parts) < 3:
                  parts.append(0)
              candidate_name = f"{parts[0]}.{parts[1]}.{parts[2]}"
              while f"v{candidate_name}" in existing_tags:
                  parts[2] += 1
                  candidate_name = f"{parts[0]}.{parts[1]}.{parts[2]}"
              final_name = candidate_name
              final_tag = f"v{final_name}"

          env_path = os.environ.get("GITHUB_ENV")
          if env_path:
              with open(env_path, "a", encoding="utf-8") as ef:
                  ef.write(f"CI_VERSION_CODE={next_code}\n")
                  ef.write(f"CI_VERSION_NAME={final_name}\n")
                  ef.write(f"CI_RELEASE_TAG={final_tag}\n")

          print(f"Computed Release Version -> versionName={final_name}, versionCode={next_code}, tag={final_tag} (max_released_code={max_released_code})")
          PY

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Generate Firebase Resources & Verify default_web_client_id
        run: |
          ./gradlew :app:processReleaseGoogleServices --no-daemon --stacktrace
          if ! grep -q "default_web_client_id" app/build/generated/res/processReleaseGoogleServices/values/values.xml; then
            echo "::error::default_web_client_id resource'u Google Services tarafından üretilemedi!"
            exit 1
          fi
          echo "default_web_client_id resource başarıyla doğrulandı."

      - name: Build Release Android APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate, Verify APK & Rename
        id: find_apk
        run: |
          set +e
          APK_PATH=""
          if [ -d "app/build/outputs/apk/release" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          fi
          set -e

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Derlenen Release APK bulunamadı!"
            exit 1
          fi

          # Verify APK signature and extract package/version/certificate metadata
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" 2>/dev/null | head -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" "$ANDROID_SDK_ROOT/build-tools" -name "aapt2" 2>/dev/null | head -n 1)

          CERT_SHA256=""
          if [ -n "$APKSIGNER" ]; then
            SIGN_OUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")
            echo "$SIGN_OUT"
            CERT_SHA256=$(echo "$SIGN_OUT" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}')
          fi

          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK_PATH" | head -n 3)
            echo "$BADGING"
            if ! echo "$BADGING" | grep -q "name='com.aistudio.blacksearobotics.kxnqpv'"; then
              echo "::error::APK applicationId beklenen değerle (com.aistudio.blacksearobotics.kxnqpv) eşleşmiyor!"
              exit 1
            fi
          fi

          TAG="${CI_RELEASE_TAG:-v${CI_VERSION_NAME:-1.0.5}}"
          FINAL_APK_NAME="BlackseaRobotics-${TAG}.apk"
          cp "$APK_PATH" "${FINAL_APK_NAME}"

          SHA256=$(sha256sum "${FINAL_APK_NAME}" | awk '{print $1}')

          echo "apk_path=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "cert_sha256=${CERT_SHA256}" >> $GITHUB_OUTPUT
          echo "version_code=${CI_VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${CI_VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Release APK Verified: ${FINAL_APK_NAME} (Version: ${CI_VERSION_NAME}, Code: ${CI_VERSION_CODE}, SHA256: ${SHA256}, CertSHA256: ${CERT_SHA256})"

      - name: Upload Release APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackseaRobotics-${{ steps.find_apk.outputs.tag_name }}-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Extract Release Notes & Metadata
        id: notes
        run: |
          INPUT_LOG="${{ github.event.inputs.changelog }}"
          FORCE="${{ github.event.inputs.force_update }}"
          SHA="${{ steps.find_apk.outputs.sha256 }}"
          CERT_SHA="${{ steps.find_apk.outputs.cert_sha256 }}"
          VC="${{ steps.find_apk.outputs.version_code }}"
          VN="${{ steps.find_apk.outputs.version_name }}"

          if [ -z "$INPUT_LOG" ]; then
            INPUT_LOG="Blacksea Robotics Mobil Uygulama Güncellemesi"
          fi
          if [ -z "$FORCE" ]; then
            FORCE="false"
          fi

          cat <<EOF > release_notes.md
          ### 🤖 Blacksea Robotics Güncellemesi (${{ steps.find_apk.outputs.tag_name }})
          ${INPUT_LOG}

          ---
          versionCode: ${VC}
          versionName: ${VN}
          applicationId: com.aistudio.blacksearobotics.kxnqpv
          sha256: ${SHA}
          certSha256: ${CERT_SHA}
          forceUpdate: ${FORCE}
          EOF

      - name: Publish GitHub Release via CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.find_apk.outputs.tag_name }}"
          APK="${{ steps.find_apk.outputs.apk_path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Mevcut sürüm ($TAG) güncelleniyor..."
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "Blacksea Robotics $TAG" \
              --notes-file release_notes.md \
              --latest
          else
            echo "Yeni sürüm ($TAG) oluşturuluyor..."
            gh release create "$TAG" "$APK" \
              --title "Blacksea Robotics $TAG" \
              --notes-file release_notes.md \
              --latest
          fi
